<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Web Component</title>
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #A528FF;
            margin: 0;
        }
        
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #333;
            padding-bottom: 0.5rem;
        }

        p {
            font-size: 0.8rem;
            color: #555;
            padding-bottom: 2rem;
        }
    </style>
    <script src="dist/form-widget.umd.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="container">
        <h1>O exemplo abaixo é um Web Component</h1>
        <p>Esse componente foi exportado de um componente React para um Web Component e gerado um bundle para ser importado nessa página externa</p>

        <form-widget></form-widget>

    </div>

</body>
</html>
